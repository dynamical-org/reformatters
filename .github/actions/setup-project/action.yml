name: Set up project
description: Install uv, Python, and locked project dependencies
runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6
      with:
        python-version-file: .python-version
    - name: Install the project
      shell: bash
      run: uv sync --all-extras --dev --locked
