name: Code Quality

permissions:
  contents: read

on:
  pull_request:
  # Also run on main so the operational deploy can depend on this via workflow_run.
  push:
    branches: [main]

# Concurrent runs on main can finish out of commit order, and each successful
# finish deploys its commit, so the older commit would deploy last.
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.arch }}, ${{ matrix.suite }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        suite: [noaa, other]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - suite: noaa
            pytest_args: tests/noaa
          - suite: other
            pytest_args: --ignore=tests/noaa

    # Keep deploy-staging.yaml and these steps in sync
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: "Set up Python"
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        # Needed to be able to compile dependencies on ARM64
        env:
          DISABLE_NUMCODECS_SSE2: 1
          DISABLE_NUMCODECS_AVX2: 1
          CFLAGS: "-Wno-implicit-function-declaration" 
        run: uv sync --all-extras --dev --locked

      - name: Install this project
        run: "uv pip install -e ."

      - name: Install profiling sampler
        if: matrix.suite == 'other'
        run: |
          uv pip install --target "$RUNNER_TEMP/profiler" --no-deps --require-hashes -r deploy/profiler-requirements.txt
          test -x "$RUNNER_TEMP/profiler/bin/py-spy"
          "$RUNNER_TEMP/profiler/bin/py-spy" --version
          echo "PY_SPY_TEST_BINARY=$RUNNER_TEMP/profiler/bin/py-spy" >> "$GITHUB_ENV"

      - name: Run Ruff
        if: matrix.suite == 'other'
        run: uv run ruff check --output-format=github

      - name: Check code format
        if: matrix.suite == 'other'
        run: uv run ruff format --check

      - name: Run ty
        if: matrix.suite == 'other'
        run: uv run ty check

      - name: Run Pytest
        run: uv run pytest -p no:sugar --verbose --durations=50 ${{ matrix.pytest_args }}

  quality:
    name: Code Quality
    needs: tests
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require all test partitions to pass
        env:
          TEST_RESULT: ${{ needs.tests.result }}
        run: |
          echo "Test matrix result: $TEST_RESULT"
          test "$TEST_RESULT" = success

  admission:
    name: Kubernetes admission
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6
        with:
          python-version-file: ".python-version"
      - name: Install dependencies
        run: uv sync --all-extras --dev --locked
      - name: Install isolated Kubernetes API server
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/envtest.tar.gz" https://github.com/kubernetes-sigs/controller-tools/releases/download/envtest-v1.36.0/envtest-v1.36.0-linux-amd64.tar.gz
          echo "302d6a4c3b7d79b8a6168cd9fd5f18e718048211d25012d969d320e06b39672d17338bcd008c29adf98b41048a6f7d80c90ab0165b4b861497ef74c7bc6c1531  $RUNNER_TEMP/envtest.tar.gz" | sha512sum --check
          tar -xzf "$RUNNER_TEMP/envtest.tar.gz" -C "$RUNNER_TEMP"
      - name: Test admission on a real API server
        env:
          REFORMATTERS_ADMISSION_TEST_ASSETS: ${{ runner.temp }}/controller-tools/envtest
        run: uv run pytest -n 0 tests/common/kubernetes_security_integration_test.py
