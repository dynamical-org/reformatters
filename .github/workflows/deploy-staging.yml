name: Deploy Staging

on:
  push:
    branches: [ 'stage/**' ]

# Per-branch concurrency so staging deploys don't block each other or main
concurrency:
  group: "deploy-staging-${{ github.ref_name }}"
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve staging target
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      cluster: ${{ steps.target.outputs.cluster }}
      environment: ${{ steps.target.outputs.environment }}
      dataset_id: ${{ steps.target.outputs.dataset_id }}
      version: ${{ steps.target.outputs.version }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: ./.github/actions/setup-project
    - name: Parse branch and resolve owner
      id: target
      env:
        BRANCH: ${{ github.ref_name }}
      run: uv run src/scripts/workflow_support.py prepare --staging-branch "$BRANCH" --require-enabled

  quality:
    name: Code Quality (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: noaa
            pytest_args: tests/noaa
          - suite: other
            pytest_args: --ignore=tests/noaa

    # Keep code-quality.yaml and these steps in sync
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-project

      - name: Install this project
        run: "uv pip install -e ."

      - name: Run Ruff
        run: uv run ruff check --output-format=github

      - name: Check code format
        run: uv run ruff format --check

      - name: Run ty
        run: uv run ty check

      - name: Run Pytest
        run: uv run pytest -p no:sugar --verbose --durations=50 ${{ matrix.pytest_args }}

  deploy:
    name: Deploy Staging
    needs: [quality, prepare]
    env:
      DYNAMICAL_CLUSTER: ${{ needs.prepare.outputs.cluster }}
      IMAGE_TAG: "${{ secrets.DOCKER_REPOSITORY }}:${{ github.sha }}"
    runs-on: ubuntu-24.04
    environment: ${{ needs.prepare.outputs.environment }}
    permissions:
      id-token: write
      contents: read

    # Keep deploy-operational-updates.yaml and these steps in sync
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch main so deploy-staging can compare versions via git show
          fetch-depth: 0

      - uses: ./.github/actions/setup-project

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5
        with:
          version: 'latest'

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }} --region ${{ secrets.AWS_REGION }}

      - name: Verify cluster identity
        env:
          CLUSTER: ${{ needs.prepare.outputs.cluster }}
        run: uv run main verify-cluster "$CLUSTER"

      - name: Set up Depot CLI
        uses: depot/setup-action@91bc8495a33ebfc504ffc89e5674379ccf23c29c # v1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
        id: login-ecr

      - uses: depot/build-push-action@98e78adca7817480b8185f474a400b451d74e287 # v1
        with:
          project: ${{ secrets.DEPOT_PROJECT }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_TAG }}
          context: .
          file: deploy/Dockerfile

      - name: Deploy staging
        env:
          DATASET_ID: ${{ needs.prepare.outputs.dataset_id }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: >
          uv run main deploy-staging
          "$DATASET_ID"
          "$VERSION"
          "$IMAGE_TAG"
