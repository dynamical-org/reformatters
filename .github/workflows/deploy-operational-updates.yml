name: Deploy Operational Updates
run-name: Deploy Operational Updates (${{ github.event.workflow_run.head_sha }})

# Gate the production deploy on Code Quality passing on main.
on:
  workflow_run:
    workflows: ["Code Quality"]
    types: [completed]
    branches: [main]

# Prevent concurrent runs since this is deploying to the K8S cluster.
# Queued main pushes apply in trigger order, which Code Quality's concurrency group
# makes equal to commit order. Other completions use separate groups.
concurrency:
  group: "deploy-${{ github.event.workflow_run.event }}-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}-${{ github.event.workflow_run.conclusion }}"
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve active targets
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      primary_environment: ${{ steps.targets.outputs.primary_environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: ./.github/actions/setup-project
      - name: Resolve active targets
        id: targets
        run: uv run src/scripts/workflow_support.py matrix

  build:
    name: Build shared image
    needs: prepare
    runs-on: ubuntu-24.04
    environment: ${{ needs.prepare.outputs.primary_environment }}
    permissions:
      id-token: write
      contents: read
    outputs:
      build-id: ${{ steps.build.outputs.build-id }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Depot CLI
        uses: depot/setup-action@91bc8495a33ebfc504ffc89e5674379ccf23c29c # v1

      - uses: depot/build-push-action@98e78adca7817480b8185f474a400b451d74e287 # v1
        id: build
        with:
          project: ${{ secrets.DEPOT_PROJECT }}
          platforms: linux/amd64,linux/arm64
          save: true
          push: false
          context: .
          file: deploy/Dockerfile

      - name: Check saved build outputs
        env:
          BUILD_ID: ${{ steps.build.outputs.build-id }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$BUILD_ID"
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]

  deploy:
    name: Deploy (${{ matrix.cluster }})
    needs: [prepare, build]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-24.04
    environment: ${{ matrix.environment }}
    permissions:
      id-token: write
      contents: read
    env:
      CLUSTER: ${{ matrix.cluster }}
      DYNAMICAL_CLUSTER: ${{ matrix.cluster }}
      DEPOT_PROJECT: ${{ secrets.DEPOT_PROJECT }}
      IMAGE_SHA: ${{ github.event.workflow_run.head_sha }}
      BUILD_ID: ${{ needs.build.outputs.build-id }}
      IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: ./.github/actions/setup-project

      - name: Load cluster settings
        env:
          AWS_CLUSTER_CONFIG: ${{ secrets.AWS_CLUSTER_CONFIG }}
          CLUSTER: ${{ matrix.cluster }}
        run: uv run src/scripts/workflow_support.py configure-cluster "$CLUSTER"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5
        with:
          version: 'latest'

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Verify cluster identity
        run: uv run main verify-cluster "$CLUSTER"

      - name: Set up Depot CLI
        uses: depot/setup-action@91bc8495a33ebfc504ffc89e5674379ccf23c29c # v1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Publish shared image
        run: depot push --project "$DEPOT_PROJECT" -t "$DOCKER_REPOSITORY:$IMAGE_SHA" "$BUILD_ID"

      - name: Verify published image digest
        run: |
          set -euo pipefail
          REPOSITORY_NAME="${DOCKER_REPOSITORY#*/}"
          DIGEST=$(aws ecr describe-images --repository-name "$REPOSITORY_NAME" --image-ids "imageTag=$IMAGE_SHA" --query 'imageDetails[0].imageDigest' --output text)
          [[ "$DIGEST" == "$IMAGE_DIGEST" ]]

      - name: Deploy
        run: uv run main deploy --cluster "$CLUSTER" --docker-image "$DOCKER_REPOSITORY:$IMAGE_SHA@$IMAGE_DIGEST"
