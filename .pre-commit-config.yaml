repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: "uv run ruff check --force-exclude --fix"
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: "uv run ruff format --force-exclude"
        language: system
        types_or: [python, pyi]
      - id: ty
        name: ty
        entry: "uv run ty check"
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
      - id: generate-manual-workflows
        name: generate manual workflows
        entry: "uv run src/scripts/generate_manual_workflows.py"
        language: system
        files: ^(src/reformatters/__main__\.py|src/reformatters/.*/dynamical_dataset\.py|src/reformatters/.*/forecast_46_day_archiver\.py|src/scripts/generate_manual_workflows\.py)$
        pass_filenames: false
        require_serial: true